llm:
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 2000
parser:
  retries: 1
  mode: fallback
search:
  iterations: 5
  random_seed: 42
  mutation_atomic_pool:
    - VOLATILITY_HIGH
    - OPEN_INTEREST_CHANGE > 0
archive:
  top_k: 5
output:
  base_dir: .hypoevolve/runs
logging:
  level: INFO

workers:
  enabled: false
  count: 1
