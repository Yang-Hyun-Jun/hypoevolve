archive:
  coverage_bins:
    - 0.05
    - 0.15
    - 0.30
  complexity_bins:
    - 3
    - 5
    - 8
output:
  base_dir: .hypoevolve/runs
  top_k_evaluator_code_artifacts: 3
logging:
  level: INFO
workers:
  enabled: true
  count: 5
