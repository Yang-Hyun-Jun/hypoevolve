llm:
  api_key: ""
  api_base: ""
  model: ""
  temperature: 0.8
  max_tokens: 10000
  retries: 1
  retry_delay: 1.0
parser:
  retries: 2
evaluator:
  dataset_schema_path: dataset.yaml
  parameters:
    window: 12
    horizon: 1
  seed: 42
search:
  iterations: 30
  steering_retries: 3
  random_steering_prob: 0.3
